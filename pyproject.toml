[project]
name = "NarcissusTCG"
version = "0.1.0"
description = "A TCG game running in qq bot"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "nonebot2[fastapi]>=2.4.4",
    "nonebot2[websockets]>=2.4.4",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-console>=0.9.0",
    "nonebot-plugin-docs>=2.4.4",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-htmlkit>=0.1.0rc4",
    "aiomysql>=0.2.0",
    "requests>=2.32.4",
    "tortoise-orm>=0.25.1",
    "aerich>=0.9.1",
    "passlib",
    "argon2_cffi",
    "cryptography>=46.0.3",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.20",
    "nonebot_plugin_alconna>=0.60.3"
]

[tool.nonebot]
plugin_dirs = []
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
nonebot-adapter-console = [
    { name = "Console", module_name = "nonebot.adapters.console" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-docs = ["nonebot_plugin_docs"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-htmlkit = ["nonebot_plugin_htmlkit"]

[tool.setuptools]
packages = ["api", "services", "db", "schemas", "core", "log", "tests", "self_types", "utils"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app/"]
exclude = [".venv/", "__pycache__/", "tests/", "log/"]

check_untyped_defs = true 
warn_return_any = true  
allow_redefinition = true
strict_optional = true

disallow_incomplete_defs = false 

[tool.aerich]
tortoise_orm = "core.config.TORTOISE_ORM_CONFIG"
location = "./migrations"
src_folder = "./."
